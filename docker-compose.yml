services:
  # Object storage S3-compatible untuk development (TDD AD-4)
  minio:
    image: minio/minio:latest
    container_name: bandjari-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Satu kali jalan: membuat bucket yang dipakai aplikasi (menunggu MinIO siap)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb -p local/bandjari-samples || true;
      exit 0;
      "

volumes:
  minio_data:
