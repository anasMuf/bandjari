server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset ber-hash dari Vite — cache lama aman
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — TanStack Router.
    # Halaman publik (/explore, /bantuan, dst.) di-prerender ke
    # dist/<path>/index.html oleh scripts/prerender.mjs (meta SEO baked-in);
    # $uri/ melayani mereka via direktori + index. Sisanya jatuh ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
