basePath: /api/v1
definitions:
  dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.CheckEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.CheckEmailResponse:
    properties:
      method:
        type: string
    type: object
  dto.CreateSectionRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateSongRequest:
    properties:
      bpm:
        maximum: 400
        minimum: 20
        type: integer
      is_system_template:
        description: |-
          IsSystemTemplate opsional: true = buat sebagai Song Template System.
          Hanya boleh dipakai admin (FR-ROLE).
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      visibility:
        description: |-
          Visibility opsional (FR-VIS): "public" hanya boleh dipakai admin;
          default "private" — lagu tidak tampil di Explore sampai dipublikasikan.
        enum:
        - public
        - private
        type: string
    required:
    - bpm
    - name
    type: object
  dto.CreateSoundSlotRequest:
    properties:
      key:
        maxLength: 2
        minLength: 1
        type: string
      label:
        maxLength: 64
        minLength: 1
        type: string
      sample_id:
        type: integer
    required:
    - key
    - label
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      password:
        description: 'Password: min 8 karakter (NIST SP 800-63B), maks 72 (batas bcrypt)
          — E-AUTH-2026 R11.'
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.DeleteAccountRequest:
    properties:
      password:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      status:
        type: integer
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginUserResponse:
    properties:
      role:
        description: Role dipakai frontend untuk menampilkan kontrol admin tanpa menunggu
          /users.
        type: string
      token:
        type: string
    type: object
  dto.NullableInt16:
    properties:
      set:
        type: boolean
      value:
        format: int32
        type: integer
    type: object
  dto.NullableString:
    properties:
      set:
        type: boolean
      value:
        type: string
    type: object
  dto.NullableUint:
    properties:
      set:
        type: boolean
      value:
        type: integer
    type: object
  dto.RefreshTokenResponse:
    properties:
      token:
        type: string
    type: object
  dto.RenameSampleRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.ReorderSectionRequest:
    properties:
      order_index:
        minimum: 0
        type: integer
    type: object
  dto.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ResetPasswordRequest:
    properties:
      code:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - code
    - password
    type: object
  dto.SetPasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  dto.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
    type: object
  dto.UpdateSectionRequest:
    properties:
      bpm_override:
        $ref: '#/definitions/dto.NullableInt16'
      loop:
        description: Loop=nil → tidak berubah; pointer bool membedakan true/false
          (sekali vs diulang).
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      next_mode:
        description: |-
          NextMode=nil → tidak berubah. Nilai valid: "order" (lanjut ke section
          berikutnya), "target" (lanjut ke next_section_id), "end" (ending/berhenti).
        enum:
        - order
        - target
        - end
        type: string
      next_section_id:
        description: |-
          NextSectionID wajib diisi saat next_mode=target; diabaikan/dikosongkan untuk
          mode lain.
        type: integer
    type: object
  dto.UpdateSongRequest:
    properties:
      bpm:
        maximum: 400
        minimum: 20
        type: integer
      name:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  dto.UpdateSongVisibilityRequest:
    properties:
      visibility:
        enum:
        - public
        - private
        type: string
    required:
    - visibility
    type: object
  dto.UpdateSoundSlotRequest:
    properties:
      key:
        maxLength: 2
        minLength: 1
        type: string
      label:
        maxLength: 64
        minLength: 1
        type: string
      sample_id:
        $ref: '#/definitions/dto.NullableUint'
    type: object
  dto.UpdateStepsRequest:
    properties:
      steps:
        $ref: '#/definitions/dto.NullableString'
    type: object
  dto.UpdateUserRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.VerifyEmailRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API untuk BandJari — penyusun & pemutar pola pukulan rebana Al-Banjari.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: BandJari API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Ganti password dengan verifikasi password lama; semua sesi lain
        dicabut
      parameters:
      - description: Password lama + baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Change password
      tags:
      - auth
  /auth/check-email:
    post:
      consumes:
      - application/json
      description: 'Email-first login: kembalikan metode login (password/google/none)'
      parameters:
      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CheckEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CheckEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Check login method for email
      tags:
      - auth
  /auth/delete-account:
    post:
      consumes:
      - application/json
      description: |-
        Hapus akun: soft delete + anonimisasi email + revoke semua sesi.
        Password wajib untuk akun ber-password; Google-only cukup sesi aktif.
      parameters:
      - description: Konfirmasi password (opsional untuk Google-only)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete account
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Kirim link reset password. Respons selalu 200 (anti email-enumeration)
      parameters:
      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
      summary: Request password reset
      tags:
      - auth
  /auth/google:
    get:
      description: |-
        Redirect ke Google OAuth (state di cookie, anti-CSRF).
        Param `link=1` menandakan mode LINK (hubungkan Google ke akun
        yang sedang login) — dipakai dari halaman Profile.
      parameters:
      - description: 1 = mode link (akun sudah login)
        in: query
        name: link
        type: integer
      responses:
        "302":
          description: Found
      summary: Login with Google
      tags:
      - auth
  /auth/google/callback:
    get:
      description: |-
        Tukar code → profil → buat/link akun → set session → redirect ke frontend.
        Mode link (state diawali "link:") → hubungkan provider ke user
        sesi aktif (validasi refresh cookie) → redirect /profile.
      responses:
        "302":
          description: Found
      summary: Google OAuth callback
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      description: Mencabut refresh token server-side dan menghapus cookie (idempotent)
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /auth/providers/google:
    delete:
      consumes:
      - application/json
      description: |-
        Putuskan hubungan Google dari akun. Ditolak (409) bila ini
        satu-satunya metode login (tanpa password & tanpa provider lain).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Unlink Google provider
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Memutar refresh token (httpOnly cookie) dan mengembalikan access
        token baru
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account (name, email, password)
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Kirim ulang link verifikasi. Respons selalu 200 (anti email-enumeration)
      parameters:
      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
      summary: Resend verification email
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Ganti password memakai kode reset; semua sesi lama dicabut
      parameters:
      - description: Email + kode + password baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /auth/sessions:
    get:
      consumes:
      - application/json
      description: Daftar sesi aktif (device, IP, waktu). `current=true` untuk sesi
        ini.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{id}/revoke:
    post:
      consumes:
      - application/json
      description: Putuskan satu sesi aktif by id (hanya milik user sendiri)
      parameters:
      - description: Session (refresh token) ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Revoke one session
      tags:
      - auth
  /auth/set-password:
    post:
      consumes:
      - application/json
      description: Pasang password untuk akun tanpa password; semua sesi lain dicabut
      parameters:
      - description: Password baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Set password (akun Google-only)
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Validasi kode verifikasi email dan menandai email terverifikasi
      parameters:
      - description: Email + kode verifikasi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Verify email
      tags:
      - auth
  /samples:
    get:
      consumes:
      - application/json
      description: Daftar Sample milik user login (filter opsional ?part=)
      parameters:
      - description: Filter part (rebana1-4, bass)
        in: query
        name: part
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List user samples
      tags:
      - samples
    post:
      consumes:
      - multipart/form-data
      description: Upload file audio .wav (maks 5MB). Admin boleh set is_system_template=true
        untuk membuat Sample Template System.
      parameters:
      - description: File audio .wav
        in: formData
        name: file
        required: true
        type: file
      - description: Nama sample
        in: formData
        name: name
        required: true
        type: string
      - description: Part (rebana1-4, bass)
        in: formData
        name: part
        required: true
        type: string
      - description: true = Sample Template System (hanya admin)
        in: formData
        name: is_system_template
        type: boolean
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Upload sample
      tags:
      - samples
  /samples/{id}:
    delete:
      consumes:
      - application/json
      description: Hapus Sample milik user. Ditolak 409 bila masih direferensikan
        SoundSlot, 403 untuk template.
      parameters:
      - description: Sample ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete sample
      tags:
      - samples
    put:
      consumes:
      - application/json
      description: Ganti nama Sample milik user. Ditolak 403 untuk Sample Template
        System.
      parameters:
      - description: Sample ID
        in: path
        name: id
        required: true
        type: integer
      - description: Nama baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RenameSampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Rename sample
      tags:
      - samples
  /samples/{id}/playback-url:
    get:
      consumes:
      - application/json
      description: Signed URL sementara (60 menit) untuk memutar file audio. Template
        dapat diakses Guest.
      parameters:
      - description: Sample ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get sample playback URL
      tags:
      - samples
  /samples/templates:
    get:
      consumes:
      - application/json
      description: Daftar Sample Template System (read-only, filter opsional ?part=)
        — dapat diakses Guest
      parameters:
      - description: Filter part (rebana1-4, bass)
        in: query
        name: part
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List sample templates
      tags:
      - samples
  /section-parts/{id}:
    put:
      consumes:
      - application/json
      description: Update rumus pukulan (steps) — tiap karakter harus merujuk key
        SoundSlot pada SectionPart terkait
      parameters:
      - description: SectionPart ID
        in: path
        name: id
        required: true
        type: integer
      - description: Steps baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStepsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update section part steps
      tags:
      - section-parts
  /section-parts/{id}/sound-slots:
    post:
      consumes:
      - application/json
      description: Tambah SoundSlot (jenis bunyi) pada SectionPart — key unik per
        SectionPart
      parameters:
      - description: SectionPart ID
        in: path
        name: id
        required: true
        type: integer
      - description: SoundSlot details
        in: body
